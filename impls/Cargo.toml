[package]
name = "mwc_wallet_impls"
version = "7.0.0"
authors = ["Mwc Developers <info@mwc.mw>"]
description = "Concrete types derived from libwallet traits"
license = "Apache-2.0"
repository = "https://github.com/mwcproject/mwc-wallet"
keywords = [ "crypto", "mwc", "mimblewimble" ]
exclude = ["**/*.mwc", "**/*.mwc2"]
edition = "2024"

[dependencies]
mwc_wallet_util = { path = "../util", version = "7.0.0" }
mwc_wallet_config = { path = "../config", version = "7.0.0" }
mwc_wallet_libwallet = { path = "../libwallet", version = "7.0.0" }
thiserror.workspace = true

[features]
swaps = ["mwc_wallet_libwallet/swaps"]
test-support = [
	"mwc_wallet_libwallet/test-support",
]

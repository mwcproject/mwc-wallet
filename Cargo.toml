[package]
name = "mwc_wallet"
version = "7.0.0"
authors = ["Mwc Developers <info@mwc.mw>"]
description = "Simple, private and scalable cryptocurrency implementation based on the MimbleWimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mwc-project/mwc-wallet"
keywords = [ "crypto", "mwc", "mimblewimble" ]
readme = "README.md"
exclude = ["**/*.mwc", "**/*.mwc2"]
build = "src/build/build.rs"
edition = "2024"

[[bin]]
name = "mwc-wallet"
path = "src/bin/mwc-wallet.rs"

[workspace]
members = ["api", "config", "controller", "impls", "libwallet", "mwc_wallet_lib", "util", "wallet_workflow"]
exclude = ["integration"]

[patch.crates-io]
# Reuse the Arti patches maintained under vendor/ in the mwc-node repository.
saturating-time = { git = "https://github.com/mwcproject/mwc-node.git", branch = "audit" }
# Match the local node dependencies in util/Cargo.toml.
#tor-ptmgr = { path = "../mwc-node/vendor/tor-ptmgr", version = "0.47.0" }
# For Git node dependencies, after the 0.46 patch is published in mwc-node:
tor-ptmgr = { git = "https://github.com/mwcproject/mwc-node.git", branch = "audit", version = "0.47.0" }

[workspace.dependencies]
thiserror = "2"
safer-ffi = { version = "0.1", features = ["std", "headers"] }

[dependencies]
mwc_wallet_api = { path = "./api", version = "7.0.0" }
mwc_wallet_impls = { path = "./impls", version = "7.0.0" }
mwc_wallet_libwallet = { path = "./libwallet", version = "7.0.0" }
mwc_wallet_controller = { path = "./controller", version = "7.0.0" }
mwc_wallet_config = { path = "./config", version = "7.0.0" }
mwc_wallet_util = { path = "./util", version = "7.0.0" }
mwc_wallet_workflow = { path = "./wallet_workflow", version = "7.0.0" }
thiserror.workspace = true

[build-dependencies]
built = { version = "0.8", features = ["git2"]}

[features]
default = []
swaps = ["mwc_wallet_impls/swaps", "mwc_wallet_libwallet/swaps", "mwc_wallet_controller/swaps", "mwc_wallet_workflow/swaps"]
test-support = [
	"mwc_wallet_api/test-support",
	"mwc_wallet_controller/test-support",
	"mwc_wallet_impls/test-support",
	"mwc_wallet_libwallet/test-support",
	"mwc_wallet_workflow/test-support",
]

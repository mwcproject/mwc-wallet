[package]
name = "mwc_wallet_util"
version = "7.0.0"
authors = ["Mwc Developers <info@mwc.mw>"]
description = "Util, for generic utilities and to re-export mwc crates"
license = "Apache-2.0"
repository = "https://github.com/mwcproject/mwc-wallet"
keywords = [ "crypto", "mwc", "mimblewimble" ]
workspace = ".."
edition = "2024"

[features]
default = []
test-support = ["mwc_core/test-support"]

[dependencies]
# Swaps related, need to be reexported
#mwc-bitcoin = { version = "0.27", path = "../../rust-bitcoin", features = ["bitcoinconsensus"] }
mwc-bitcoin = { git = "https://github.com/mwcproject/rust-bitcoin",  version = "0.27.2", branch = "zkp", features = ["serde"] }
#bch = { path = "../../rust-bch" }
mwc-bch = { git = "https://github.com/mwcproject/rust-bch", version = "0.2.1", branch = "master" }
web3 = { version = "0.15.0", default-features = false, features = ["ws-tls-async-std", "signing"] }
mwc-web3 = { git = "https://github.com/mwcproject/rust-web3", version = "0.20.1", branch = "master",  default-features = false, features = ["ws-rustls-tokio", "signing"] }
mwc-wagyu-ethereum = { git = "https://github.com/mwcproject/wagyu-ethereum", version = "0.7.0", branch = "master" }
mwc-wagyu-model = { git = "https://github.com/mwcproject/wagyu-model",version = "0.7.0",  branch = "master" }
#mwc-zcash_primitives = { git = "https://github.com/mwcproject/librustzcash", version = "0.29.0", branch = "master", features = ["transparent-inputs"] }
#zcash_primitives = { path = "../../librustzcash/zcash_primitives", features = ["transparent-inputs"] }
bitcoin_hashes = { version = " 1.0", features = ["serde"] }

